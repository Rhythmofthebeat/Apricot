{% extends "base.html" %}
{% block title %}Complete Your Employer Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header"><i class="fas fa-building me-2"></i>One more step</div>
            <div class="card-body p-4">
                <p class="text-muted">You signed up with Google. Just add your company name to finish setting up your employer account.</p>
                <form method="POST">
                    <div class="mb-4">
                        <label for="companyName" class="form-label fw-bold">Company Name</label>
                        <input type="text" class="form-control" id="companyName" name="companyName" placeholder="Enter your company name" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Continue</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
