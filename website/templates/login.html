{% extends "base.html" %}
{% block title %}Log In | Avants{% endblock %}

{% block head %}
<style>
    .auth-wrap {
        min-height: calc(100vh - 140px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
    }
    .auth-card {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 40px 36px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }
    .auth-logo { height: 32px; margin-bottom: 28px; }
    .auth-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 6px; }
    .auth-sub { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 28px; }
    .divider-line {
        display: flex; align-items: center; gap: 12px;
        color: var(--text-muted); font-size: 0.78rem; font-weight: 500;
        margin: 20px 0;
    }
    .divider-line:before, .divider-line:after {
        content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .google-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 11px 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.12s, border-color 0.12s;
    }
    .google-btn:hover { background: var(--bg); border-color: #94a3b8; color: var(--text); }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <img src="{{ url_for('static', filename='Avants.png') }}" alt="Avants" class="auth-logo">
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-sub">Log in to your Avants account</p>

        <form method="POST">
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold" style="font-size:0.85rem;">Email address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="you@company.com" required autocomplete="email">
            </div>
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="password" class="form-label fw-semibold mb-0" style="font-size:0.85rem;">Password</label>
                    <a href="{{ url_for('auth.forgot_password') }}" class="text-muted text-decoration-none" style="font-size:0.78rem;">Forgot password?</a>
                </div>
                <input type="password" class="form-control" id="password" name="password" placeholder="Your password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-2" style="padding:11px;">Log in</button>
        </form>

        <div class="divider-line">or</div>

        <a href="{{ url_for('auth.login_google') }}" class="google-btn">
            <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" style="width:18px;height:18px;">
            Continue with Google
        </a>

        <p class="text-center text-muted mt-4 mb-0" style="font-size:0.85rem;">
            No account yet? <a href="{{ url_for('auth.sign_up') }}" class="fw-semibold text-decoration-none">Sign up free</a>
        </p>
    </div>
</div>
{% endblock %}
