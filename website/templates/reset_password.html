<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>
</head>
<body>
  <h2>Reset Password</h2>

  <form id="resetForm">
    <input type="password" id="password" placeholder="New password" required />
    <button type="submit">Update Password</button>
  </form>

  <p id="msg"></p>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const supabase = createClient(
      "https://rfkgkjlfylhtzxevpphs.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJma2dramxmeWxodHp4ZXZwcGhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM5Mzk3NjEsImV4cCI6MjA3OTUxNTc2MX0.d5kmukDMp2YJZVf_A3T1eBbXDUv_HMu1nDMk4md9vpU"

    );

    // 🔑 THIS IS THE FIX
    const { data, error } =
      await supabase.auth.exchangeCodeForSession(window.location.search);

    if (error) {
      document.getElementById("msg").innerText =
        "Invalid or expired reset link.";
      console.error(error);
      throw error;
    }

    document.getElementById("resetForm").onsubmit = async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;

      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        document.getElementById("msg").innerText = error.message;
      } else {
        document.getElementById("msg").innerText =
          "Password updated! Redirecting...";
        setTimeout(() => window.location = "/login", 1500);
      }
    };
  </script>
</body>
</html>
